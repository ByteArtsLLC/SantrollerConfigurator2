# On every push to main: builds the configurator once, deploys it to GitHub Pages, and releases the
# desktop app for Linux, Windows and macOS around that same build, versioned by
# scripts/version.mjs. The desktop release is built as a draft and only published once every
# platform built.
name: Deploy and release

on:
  push:
    branches: ['main']
  workflow_dispatch:

# Each job asks for what it needs
permissions: {}

# A newer push replaces a run that is still going, so an older build can't end up deployed or
# released as latest
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  # The configurator and the firmware it ships only need building once, on linux, as the desktop
  # builds just wrap them
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build
        id: build
        uses: ./.github/actions/build-web
      - name: Upload configurator
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
      - name: Upload for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  pages:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # The draft is created once here, not by each platform: tauri-action looks for drafts in the
  # release list, which lags behind, so two platforms finishing together would each create one
  release:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.web.outputs.version }}
    steps:
      # A re-run of the same commit picks up the draft it left behind
      - name: Create the draft release
        id: draft
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"v$VERSION\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="v$VERSION" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Santroller Configurator $VERSION" \
              -f body="Built from $GITHUB_SHA. See the assets below to download and install it." \
              -F draft=true -F prerelease=false --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    needs: [web, release]
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          # the oldest supported ubuntu, so the .deb and AppImage run on older distros too
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}
    env:
      VERSION: ${{ needs.web.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # The frontend comes from the web job, so there's nothing to build before bundling. Releases
      # are signed for the updater, which local builds don't need.
      - name: Configure the release
        shell: bash
        run: |
          echo "{\"version\": \"$VERSION\", \"build\": {\"beforeBuildCommand\": \"\"}, \"bundle\": {\"createUpdaterArtifacts\": true}}" > src-tauri/tauri.release.conf.json
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
      - name: Download configurator
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the updates, the app only installs ones signed with this key
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: yarn tauri
          # each platform adds itself to the release's latest.json, which the app checks for updates
          includeUpdaterJson: true
          releaseId: ${{ needs.release.outputs.id }}
          # still needed so latest.json links to the tag rather than the draft's untagged-* url
          tagName: v${{ env.VERSION }}
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  publish:
    needs: [release, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE: repos/${{ github.repository }}/releases/${{ needs.release.outputs.id }}
    steps:
      # The platforms all write to the same latest.json, so make sure none of them were lost before
      # the app starts offering this release as an update
      - name: Check the updater manifest
        run: |
          asset=$(gh api "$RELEASE" --jq '.assets[] | select(.name == "latest.json") | .url')
          [ -n "$asset" ] || { echo "the release has no latest.json"; exit 1; }
          gh api -H 'Accept: application/octet-stream' "$asset" > latest.json
          for platform in linux-x86_64 windows-x86_64 darwin-x86_64 darwin-aarch64; do
            jq -e --arg p "$platform" '.platforms[$p].signature | length > 0' latest.json > /dev/null \
              || { echo "latest.json is missing $platform"; cat latest.json; exit 1; }
          done
      - name: Publish the release
        run: gh api -X PATCH "$RELEASE" -F draft=false -f make_latest=true --silent
      # Runs cancelled by a newer push leave their drafts behind. Only drafts created before this
      # one are removed, in case a newer run has already made its own.
      - name: Discard older drafts
        run: |
          created=$(gh api "$RELEASE" --jq .created_at)
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .created_at < \"$created\") | \"\(.id) \(.tag_name)\"" |
            while read -r id tag; do
              echo "Deleting draft $tag ($id)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
